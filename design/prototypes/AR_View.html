<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>RaceLens AR Tracking View</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#0058bc",
                      "secondary-container": "#fe9400",
                      "background": "#f9f9ff",
                      "on-surface": "#001c3b",
                      "error": "#ba1a1a",
                      "success": "#198754"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "20px",
                      "container-gap": "24px"
              }
            }
          }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* 🌟 1. 全项目核心大一统：标准 15% 极薄高饱和度苹果全息毛玻璃 */
        .glass-card {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6),
                        inset 0 -1px 2px rgba(255, 255, 255, 0.1),
                        0 12px 32px rgba(0, 0, 0, 0.15);
        }

        /* 🌟 2. 严格封装的卡片内容墨黑体系 */
        .glass-card-tag {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: rgba(0, 28, 59, 0.5);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .glass-card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: rgba(0, 28, 59, 0.9);
        }

        .glass-card-desc {
            font-size: 0.875rem;
            font-weight: 400;
            color: rgba(0, 28, 59, 0.7);
            line-height: 1.625;
        }

        /* 🌟 3. 各自专属的赛事彩色数据 Icon */
        .icon-speed { color: #fe9400 !important; }
        .icon-heading { color: #0058bc !important; }
        .icon-vmg { color: #008733 !important; }

        /* 🎚️ 4. 四段式硬件级核心模式切换滑块轨道 */
        .mode-slider-track-4 {
            background-color: rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            padding: 4px;
            border-radius: 9999px;
            display: flex;
            position: relative;
            align-items: center;
            width: 350px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* ⚪ 白色全息果冻物理滑块 */
        .mode-slider-thumb-4 {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(25% - 5px); 
            background-color: #ffffff;
            border-radius: 9999px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.1);
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 0;
        }

        /* 滑块平移位置矩阵 */
        .mode-slider-track-4.is-camera .mode-slider-thumb-4 { transform: translateX(100%); }
        .mode-slider-track-4.is-replay .mode-slider-thumb-4 { transform: translateX(200%); }
        .mode-slider-track-4.is-settings .mode-slider-thumb-4 { transform: translateX(300%); }

        /* 滑块内部控制按钮 */
        .mode-slider-btn-4 {
            flex: 1;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            letter-spacing: 0.02em;
            padding: 8px 0;
            z-index: 10;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            transition: color 0.2s ease;
        }

        /* 全息和动态脉冲 */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .pulse-ring-1 { animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        .pulse-ring-2 { animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; animation-delay: 0.5s; }
        
        .dashed-anchor {
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 1) 50%, rgba(255, 255, 255, 0) 0%);
            background-position: right;
            background-size: 2px 8px;
            background-repeat: repeat-y;
        }
    </style>
</head>
<body class="bg-black text-on-surface antialiased overflow-hidden select-none">

    <main class="relative w-full h-screen h-[100dvh] flex flex-col justify-between">
        
        <img class="absolute inset-0 w-full h-full object-cover z-0" src="1.jpg"/>

        <div class="absolute inset-x-0 top-0 z-50 flex flex-col pointer-events-none">
            <div class="h-8 w-full"></div>
            
            <div class="px-margin-mobile flex justify-between items-start mt-2 relative w-full">
                <button class="w-[44px] h-[44px] shrink-0 rounded-full glass-card flex items-center justify-center text-white active:scale-95 transition-transform shadow-lg pointer-events-auto">
                    <span class="material-symbols-outlined text-white text-2xl" style="font-variation-settings: 'wght' 400;">explore</span>
                </button>
                
                <div class="w-[152px] pointer-events-auto select-none mr-1">
                    
                    <div id="map-collapsible-card" class="w-full glass-card rounded-[18px] flex flex-col shadow-2xl transition-all duration-500 ease-[cubic-bezier(0.25,1,0.2,1)]" style="height: 96px; overflow: hidden;">
                        
                        <div onclick="toggleMapCard()" class="h-[96px] w-full bg-white/10 relative overflow-hidden block cursor-pointer border-b border-white/20 active:bg-white/20 transition-colors shrink-0">
                            <svg class="w-full h-full" viewbox="0 0 148 96">
                                <path d="M0 20 Q40 10 70 30 T148 15 V96 H0 Z" fill="rgba(255,255,255,0.1)" opacity="0.3"></path>
                                <path d="M30 70 L74 20 L118 70 Z" fill="none" stroke="rgba(255,255,255,0.7)" stroke-dasharray="3,2" stroke-width="1.5"></path>
                                <circle cx="30" cy="70" fill="#fe9400" r="2.5"></circle>
                                <circle cx="74" cy="20" fill="#fe9400" r="2.5"></circle>
                                <circle cx="118" cy="70" fill="#fe9400" r="2.5"></circle>
                                <circle cx="70" cy="25" fill="#FF9F0A" r="2.5"></circle>
                                <circle cx="65" cy="35" fill="#E2E8F0" r="2.5"></circle>
                                <circle cx="80" cy="40" fill="#FFCC00" r="2.5"></circle>
                                <circle cx="50" cy="50" fill="#E2E8F0" r="2.5"></circle>
                                <circle cx="40" cy="60" fill="#FF3B30" r="4.5" class="animate-pulse"></circle>
                                <text font-size="8" x="46" y="63">🇨🇦</text>
                            </svg>

                            <div id="map-card-arrow" class="absolute bottom-1 left-1/2 -translate-x-1/2 text-white/40 transition-transform duration-400 ease-[cubic-bezier(0.25,1,0.2,1)]">
                                <span class="material-symbols-outlined text-[14px]">keyboard_arrow_down</span>
                            </div>
                        </div>
                        
                        <div id="map-card-content-wrapper" class="flex flex-col flex-grow opacity-0 transition-opacity duration-300 pointer-events-none">
                            <div class="p-2.5 flex flex-col gap-1.5 font-sans shrink-0">
                                <div class="flex items-center justify-between text-[10px] font-bold text-on-surface/90">
                                    <span class="flex items-center gap-1">① 🟠 <span class="font-black">ESP</span></span>
                                    <span class="text-[9px] text-on-surface/40 uppercase tracking-wider">LEADER</span>
                                </div>
                                <div class="flex items-center justify-between text-[10px] font-medium text-on-surface/80">
                                    <span class="flex items-center gap-1">② 🇺🇸 USA</span>
                                    <span class="text-[9px] text-on-surface/50 font-bold">+76m</span>
                                </div>
                                <div class="flex items-center justify-between text-[10px] font-medium text-on-surface/80">
                                    <span class="flex items-center gap-1">③ 🇦🇺 AUS</span>
                                    <span class="text-[9px] text-on-surface/50 font-bold">+108m</span>
                                </div>
                                <div class="text-center text-[8px] leading-none text-on-surface/30 font-black">- - -</div>
                                
                                <div class="flex items-center justify-between text-[10px] bg-red-500/20 border-l-2 border-red-500 px-1.5 py-0.5 text-red-600 font-extrabold rounded-sm">
                                    <span class="flex items-center gap-0.5">⑥ 🇨🇦 CAN</span>
                                    <span class="text-[9px] font-black">+224m</span>
                                </div>
                            </div>
                            
                            <div class="px-2 py-1 bg-black/5 border-t border-white/20 flex items-center justify-between text-[8px] font-bold text-on-surface/50 shrink-0 mt-auto">
                                <span>19:15 UTC</span>
                                <div class="flex items-center gap-0.5">
                                    <span class="w-1 h-1 bg-red-500 rounded-full animate-ping"></span>
                                    <span class="text-red-500 font-black">LIVE</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 relative pointer-events-none z-30">
            <div class="absolute top-[38%] left-[45%] flex flex-col items-center">
                <div class="glass-card rounded-lg px-3 py-1.5 shadow-lg flex items-center gap-2 pointer-events-auto">
                    <span class="font-sans font-black text-sm text-rgba(0,28,59,0.9)">🇨🇦 CAN | 46.1 km/h</span>
                </div>
                <div class="relative w-6 h-6 mt-2 flex items-center justify-center">
                    <div class="absolute w-full h-full rounded-full border-2 border-secondary-container pulse-ring-1"></div>
                    <div class="absolute w-full h-full rounded-full border-2 border-secondary-container pulse-ring-2"></div>
                    <div class="w-2 h-2 bg-secondary-container rounded-full shadow-[0_0_8px_#fe9400]"></div>
                </div>
                <div class="w-[2px] h-28 dashed-anchor mt-1 opacity-70"></div>
            </div>
        </div>

        <div class="relative z-40 w-full px-4 pb-6 flex flex-col items-center gap-5 pointer-events-auto">
            
            <div class="w-full glass-card rounded-[24px] p-5 shadow-[0_-8px_32px_rgba(0,0,0,0.08)]">
                <div class="flex flex-col mb-4">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">🇨🇦</span>
                        <h2 class="glass-card-title">Canada SailGP Team</h2>
                    </div>
                    <p class="glass-card-desc mt-0.5">Race 1 · Halifax Harbour</p>
                </div>

                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div class="bg-white/40 border border-white/50 rounded-xl p-2.5 flex flex-col items-center justify-center">
                        <span class="material-symbols-outlined icon-speed text-xl mb-0.5">speed</span>
                        <span class="text-[19px] font-black text-on-surface leading-none">46.1</span>
                        <span class="glass-card-tag mt-1">km/h SPEED</span>
                    </div>
                    <div class="bg-white/40 border border-white/50 rounded-xl p-2.5 flex flex-col items-center justify-center">
                        <span class="material-symbols-outlined icon-heading text-xl mb-0.5" style="transform: rotate(26deg);">navigation</span>
                        <span class="text-[19px] font-black text-on-surface leading-none">26°</span>
                        <span class="glass-card-tag mt-1">HEADING</span>
                    </div>
                    <div class="bg-white/40 border border-white/50 rounded-xl p-2.5 flex flex-col items-center justify-center">
                        <span class="material-symbols-outlined icon-vmg text-xl mb-0.5">air</span>
                        <span class="text-[19px] font-black text-on-surface leading-none">13.3</span>
                        <span class="glass-card-tag mt-1">km/h VMG</span>
                    </div>
                </div>

                <button class="w-full bg-white/40 border border-white/50 hover:bg-white/50 transition-colors text-primary py-2.5 rounded-full font-sans font-bold text-xs flex items-center justify-center gap-1 shadow-sm">
                    View Timeline
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                </button>
            </div>

            <div class="mode-slider-track-4 mx-auto mb-2">
                <div class="mode-slider-thumb-4"></div>
                
                <button class="mode-slider-btn-4 text-on-background">
                    <span class="material-symbols-outlined text-[18px]">visibility</span>
                    <span class="text-[8.5px] font-black tracking-wide">LIVE AR</span>
                </button>
                
                <button class="mode-slider-btn-4 text-white/60 hover:text-white/90">
                    <span class="material-symbols-outlined text-[18px]">photo_camera</span>
                    <span class="text-[8.5px] font-black tracking-wide">CAMERA</span>
                </button>
                
                <button class="mode-slider-btn-4 text-white/60 hover:text-white/90">
                    <span class="material-symbols-outlined text-[18px]">history</span>
                    <span class="text-[8.5px] font-black tracking-wide">REPLAY</span>
                </button>

                <button class="mode-slider-btn-4 text-white/60 hover:text-white/90">
                    <span class="material-symbols-outlined text-[18px]">settings</span>
                    <span class="text-[8.5px] font-black tracking-wide">SETTINGS</span>
                </button>
            </div>

        </div>
    </main>

    <script>
        let isMapExpanded = false;

        function toggleMapCard() {
            const card = document.getElementById('map-collapsible-card');
            const wrapper = document.getElementById('map-card-content-wrapper');
            const arrow = document.getElementById('map-card-arrow');

            isMapExpanded = !isMapExpanded;

            if (isMapExpanded) {
                card.style.height = '275px';
                arrow.style.transform = 'rotate(180deg)';
                
                setTimeout(() => {
                    if(isMapExpanded) {
                        wrapper.style.opacity = '1';
                        wrapper.style.pointerEvents = 'auto';
                    }
                }, 120);
            } else {
                wrapper.style.opacity = '0';
                wrapper.style.pointerEvents = 'none';
                card.style.height = '96px';
                arrow.style.transform = 'rotate(0deg)';
            }
        }
    </script>
</body>
</html>
