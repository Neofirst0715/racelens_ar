<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .premium-text-shadow {
            text-shadow: 
                0 2px 12px rgba(0, 0, 0, 0.3), 
                0 4px 24px rgba(0, 0, 0, 0.15),
                0 1px 2px rgba(0, 0, 0, 0.2);
        }
        .scrim-overlay {
            background: linear-gradient(to bottom, 
                rgba(0, 0, 0, 0.2) 0%, 
                rgba(0, 0, 0, 0.05) 40%, 
                rgba(0, 0, 0, 0.15) 70%, 
                rgba(0, 0, 0, 0.35) 100%
            );
        }
        .spinner-container {
            position: relative;
            width: 44px;
            height: 44px;
        }
        .spinner-bg {
            position: absolute;
            inset: 0;
            border: 4px solid rgba(0, 0, 0, 0.15);
            border-radius: 50%;
        }
        .spinner-track {
            position: absolute;
            inset: 0;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }
        .spinner-play {
            position: absolute;
            inset: 0;
            border: 4px solid transparent;
            border-top-color: #fe9400; /* 标志性副标题橙 */
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .your-background-image-class {
        width: 100vw;                
        height: 100vh;             
        
        object-fit: cover;           
        object-position: center;    
        }

<body class="bg-slate-100 h-screen w-screen overflow-hidden font-body-md text-on-surface m-0 p-0 flex items-center justify-center">

      <div class="h-2.5 w-2.5 rounded-full bg-slate-900/80"></div>
    </div>
    <!-- Home bar -->
    <div class="absolute bottom-2 left-1/2 z-50 h-1 w-32 -translate-x-1/2 rounded-full bg-white/40"></div>

    <!-- 内容区 -->
    <div class="h-full w-full overflow-hidden rounded-[38px] bg-black relative">

<!-- Background Image -->
<div class="absolute inset-0 w-full h-full z-0">
