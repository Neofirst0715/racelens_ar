<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RaceLens AR - Permission</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#0058bc",
                        "secondary-container": "#fe9400",
                        "background": "#f9f9ff",
                        "on-surface": "#001c3b"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-gap": "24px",
                        "margin-mobile": "20px"
                    }
                }
            }
        }
    </script>
<style>
        /* 1. 核心毛玻璃卡片 */
        .glass-card {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px) saturate(190%);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 1px 1px rgba(255,255,255, 0.6),
                        inset 0 -1px 2px rgba(255,255,255, 0.1),
                        0 12px 32px rgba(0, 0, 0, 0.15);
        }
        
        /* 2. 苹果文本阴影 */
        .text-shadow-apple{
             text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        /* 3. 次级动作按钮 */
        .glass-button-secondary {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }    
        
        .glass-card-icon-wrap {
            background-color: rgba(255, 255, 255, 0.4); /* 稍微加厚一点白底，衬托彩色的图标 */
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 12px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            width: 48px;
            flex-shrink: 0;
        }
        .icon-location {
            color: #0058bc !important;
        }
        .icon-camera {
            color: #fe9400 !important;
        }

        /* 优雅的系统次级高亮白小标签 */
        .glass-card-tag {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.8);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }

        /* 纯白主标题，直接融合抗强光的文本阴影 */
        .glass-card-title {
            font-size: 1.25rem; /* 20px */
            font-weight: 700;
            color: rgba(0, 28, 59, 0.9);;
            margin-bottom: 4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1), 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        /* 你的专属描述样式（微调为高能见度的 0.85 保证可读性） */
        .glass-card-desc {
            font-size: 0.875rem; /* 14px */
            font-weight: 400;
            color: rgba(0, 28, 59, 0.7);
            line-height: 1.625;
        }
</style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden relative">
<div class="absolute inset-0 w-full h-full z-0">
  <img alt="Background" class="w-full h-full object-cover object-center" src="Background.jpg"/>
</div>
<div class="absolute top-0 w-full h-12 z-20"></div>
<main class="relative z-10 flex flex-col h-full w-full px-margin-mobile pt-16 pb-10">
<header class="w-full text-center mb-auto mt-20">
    <h1 class="font-sans font-extrabold text-[50px] text-white text-shadow-apple leading-none tracking-tighter">
        RaceLens <span class="text-[#fe9400]">AR</span>
    </h1>
</header>

<section class="w-full max-w-md mx-auto space-y-container-gap mb-10">
    <div class="glass-card rounded-[18px] p-6 flex items-start gap-4 shadow-lg">
        <div class="glass-card-icon-wrap">
            <span class="material-symbols-outlined icon-location text-2xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
        </div>
        <div class="flex flex-col">
            <span class="glass-card-title">📍 LOCATION</span>
            <h2 class="glass-card-title">Know Where You Are</h2>
            <p class="glass-card-desc">GPS orients live AR boat markers on Halifax Harbour.</p>
        </div>
    </div>

    <div class="glass-card rounded-[18px] p-6 flex items-start gap-4 shadow-lg">
        <div class="glass-card-icon-wrap">
            <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
        </div>
        <div class="flex flex-col">
            <span class="glass-card-title">📷 CAMERA</span>
            <h2 class="glass-card-title">See the Race in AR</h2>
            <p class="glass-card-desc">Overlay real-time CAN team data on your live viewfinder.</p>
        </div>
    </div>
</section>

<footer class="w-full max-w-md mx-auto flex flex-col items-center gap-4 pb-safe">
    <button class="w-full bg-white text-[#0058bc] text-[17px] font-bold py-4 rounded-full shadow-lg hover:bg-white/90 active:scale-95 transition-all">
        Allow Access
    </button>
    <button class="w-full glass-button-secondary text-white font-semibold text-[16px] py-3.5 rounded-full hover:bg-white/10 active:scale-[0.98] transition-all">
        Not Now
    </button>
</footer>
</main>
</body></html>
